name: build-and-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"   # nightly: link health + rebuild (keeps cutoff year fresh)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Link health check
        run: python scripts/linkcheck.py
      - name: Daily drip — release 1 pending dossier
        run: python scripts/drip_publish.py
      - name: Research packets for every dossier (the drip adds new ones daily)
        run: python scripts/export_evidence.py --all
      - name: Public Domain Day dataset (class of 1931)
        run: python scripts/class_export.py 1931
      - name: Build site
        env:
          # 2026-11-17: own domain (Cloudflare DNS -> GitHub Pages); bitgitty.github.io/rightsatlas/* redirects here
          BASE_URL: /
          SITE_ORIGIN: https://rightsatlas.net
        run: python build.py
      - name: Acceptance tests (evidence gates, cutoff, no-leak)
        run: python tests/test_acceptance.py
      # commit only after build + tests pass: a released dossier that breaks them stays pending (AGF P2b)
      - name: Commit link status + daily drip (keepalive)
        run: |
          git config user.name "rightsatlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "nightly: link status + daily-drip release"
          git push
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # 2026-11-20: tell Bing/Yandex/Seznam (IndexNow) about every page after each deploy, so new blog posts
      # and tools are crawled within hours instead of weeks. Key file: static/<key>.txt. Never fails the deploy.
      - name: IndexNow ping
        continue-on-error: true
        run: |
          sleep 60
          KEY=e9a181090cd34e9cfbf915cc9d11a6d9
          curl -s https://rightsatlas.net/sitemap.txt | python3 -c "import sys,json; u=[l.strip() for l in sys.stdin if l.strip()]; print(json.dumps({'host':'rightsatlas.net','key':'$KEY','keyLocation':'https://rightsatlas.net/$KEY.txt','urlList':u[:10000]}))" > body.json
          curl -s -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" --data @body.json
